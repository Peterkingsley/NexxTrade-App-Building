<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexxTrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              // Override defaults to map to CSS variables for theming
              white: 'var(--text-main)',
              gray: {
                400: 'var(--text-muted)',
                500: 'var(--text-muted-dark)',
              },
              dark: {
                900: 'var(--bg-base)',
                800: 'var(--bg-surface)',
                700: 'var(--border-color)',
              },
              brand: {
                green: '#10B981',
                neon: '#34D399',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Dark Theme (Default) */
        --bg-base: #0B0E14;
        --bg-surface: #151A25;
        --border-color: #1E293B;
        --text-main: #FFFFFF;
        --text-muted: #9CA3AF;
        --text-muted-dark: #6B7280;
      }

      body.light-theme {
        /* Light Theme */
        --bg-base: #F3F4F6;
        --bg-surface: #FFFFFF;
        --border-color: #E5E7EB;
        --text-main: #111827;
        --text-muted: #6B7280;
        --text-muted-dark: #4B5563;
      }

      body {
        background-color: var(--bg-base);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-base);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #34D399;
      }

      /* Animations */
      @keyframes fadeInSlide {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide {
        animation: fadeInSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Glowing Pulse for Icons */
      @keyframes glowPulse {
        0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); transform: scale(1); }
        50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); transform: scale(1.05); }
        100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); transform: scale(1); }
      }
      .animate-glow-pulse {
        animation: glowPulse 2s infinite;
      }

      /* Subtle Pulse for Hit Targets */
      @keyframes targetHitPulse {
        0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
        70% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
        100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
      }
      .animate-target-hit {
        animation: targetHitPulse 2s infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@react-oauth/google": "https://esm.sh/@react-oauth/google@^0.13.4",
    "react/": "https://esm.sh/react@^19.2.4/",

    "pg": "https://esm.sh/pg@^8.18.0",
    "express": "https://esm.sh/express@^5.2.1",
    "cors": "https://esm.sh/cors@^2.8.6",
    "dotenv": "https://esm.sh/dotenv@^17.2.3",
    "crypto": "https://esm.sh/crypto@^1.0.1",
    "path": "https://esm.sh/path@^0.12.7",
    "fs": "https://esm.sh/fs@^0.0.1-security",
    "url": "https://esm.sh/url@^0.11.4",
    "web-push": "https://esm.sh/web-push@^3.6.7",
    "buffer": "https://esm.sh/buffer@^6.0.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "@capacitor/cli": "https://esm.sh/@capacitor/cli@^8.0.2",
    "@capacitor/core": "https://esm.sh/@capacitor/core@^8.0.2",
    "@codetrix-studio/capacitor-google-auth": "https://esm.sh/@codetrix-studio/capacitor-google-auth@^3.4.0-rc.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      // Register Service Worker for Mobile Notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful');
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
